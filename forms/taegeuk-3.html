 you can stand and move your left foot about a foot's length to your left.\",\"timestamp\":164.2,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Taeguk Ija consists of one key move, Olgul Jirugi.\",\"timestamp\":116.8,\"video_id\":\"tGlrUplKHh8\"},{\"text\":\"Taeguk Samjang consists of four key moves, namely\",\"timestamp\":124.3,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"We will now take a closer look at each of the key moves of Taegeuk Ojang.\",\"timestamp\":149.3,\"video_id\":\"VdqNEAHWCBM\"},{\"text\":\"These are the key moves of Taegeuk Yukjang.\",\"timestamp\":136,\"video_id\":\"jcBwWo4wN7c\"},{\"text\":\"We will now take a closer look at each of the key moves of Taegeuk Yukjang.\",\"timestamp\":140,\"video_id\":\"jcBwWo4wN7c\"},{\"text\":\"Sonnal Olgul Bituromaki is a technique used to perform Olgul Bakanmaki\",\"timestamp\":145,\"video_id\":\"jcBwWo4wN7c\"},{\"text\":\"We will now take a closer look at each of the key moves of Taeguk Chiljang.\",\"timestamp\":170.9,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"손 날 아래 맞기 is a technique used to block, defend the lower body with your arms and with the help from an assisting hand.\",\"timestamp\":176.9,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"These are the six key moves of Taeguk paljang.\",\"timestamp\":168.1,\"video_id\":\"Gr_Je2ZkgkI\"},{\"text\":\"We will now take a closer look at each of the key moves of Taeguk paljang.\",\"timestamp\":172.4,\"video_id\":\"Gr_Je2ZkgkI\"}],\"used_in\":[\"hansu\",\"ilyeo\",\"jitae\",\"keumgang\",\"pyeongwon\",\"sipjin\",\"taebaek\",\"taegeuk-1\",\"taegeuk-2\",\"taegeuk-3\",\"taegeuk-4\",\"taegeuk-5\",\"taegeuk-6\",\"taegeuk-7\",\"taegeuk-8\"]},\"knifehand-inward-strike\":{\"key\":\"knifehand-inward-strike\",\"name\":{\"en\":\"Knifehand Inward Strike\",\"ko\":\"기본 준비자세\",\"romanized\":\"Sonal Anchigi\"},\"category\":\"strike\",\"source\":{\"form_id\":\"taegeuk-3\",\"form_name\":\"Taegeuk Sam Jang\",\"video_id\":\"ksSqKt0UkWo\",\"timestamp\":127,\"timestamp_end\":227},\"tips\":[{\"text\":\"The hand blade, used in the move, extends from the wrist to the first joint of the little finger\",\"timestamp\":156,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"First open your hand, place the four fingers from the index to the little finger together\",\"timestamp\":163,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Then bend the tip of the thumb and place it on top of the first joint of the index finger\",\"timestamp\":170,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"And bend the tips a little inward\",\"timestamp\":180,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Place the wrist of the thrusting arm at shoulder level, and the supporting arm at the solar plexus level\",\"timestamp\":189,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Perform the Sonal Anchigi move by pulling both elbows towards your body\",\"timestamp\":203,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Place your supporting hand back at the wrist\",\"timestamp\":213,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"The wrist of the striking hand should be straight\",\"timestamp\":219,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"And your hand blade should be raised near your neck level\",\"timestamp\":224,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"These are the four key moves of Taeguk Samjang.\",\"timestamp\":132.3,\"video_id\":\"ksSqKt0UkWo\"}],\"used_in\":[\"taegeuk-3\"]},\"knifehand-middle-outward-block\":{\"key\":\"knifehand-middle-outward-block\",\"name\":{\"en\":\"Knifehand Middle Outward Block\",\"ko\":\"손날몸통바깥막기\",\"romanized\":\"Sonal Momtong Bakkan Makki\"},\"category\":\"block\",\"source\":{\"form_id\":\"taegeuk-3\",\"form_name\":\"Taegeuk Sam Jang\",\"video_id\":\"ksSqKt0UkWo\",\"timestamp\":227,\"timestamp_end\":276},\"tips\":[{\"text\":\"Begin with two arms crossed in front of the chest\",\"timestamp\":242,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"The defending arm and supporting arm should be placed on the outside and inside respectively when the arms are crossed\",\"timestamp\":246,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"The tip of the hand of the defending arm should not be above the shoulder when defending\",\"timestamp\":258,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"And the elbow should face downward\",\"timestamp\":262,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Be careful not to let the wrist bend\",\"timestamp\":268,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"And the hand blade should not be outside the end of the line extending from the torso\",\"timestamp\":272,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Sonnal Pakkadmakki is also a technique that uses the hand blade in the same way as the previous\",\"timestamp\":229.7,\"video_id\":\"ksSqKt0UkWo\"}],\"used_in\":[\"pyeongwon\",\"taegeuk-3\"]},\"back-stance\":{\"key\":\"back-stance\",\"name\":{\"en\":\"Back Stance\",\"ko\":\"제비품안치기\",\"romanized\":\"Dwitgubi\"},\"category\":\"stance\",\"source\":{\"form_id\":\"taegeuk-3\",\"form_name\":\"Taegeuk Sam Jang\",\"video_id\":\"ksSqKt0UkWo\",\"timestamp\":276,\"timestamp_end\":308},\"tips\":[{\"text\":\"Your feet should form a 90 degree angle\",\"timestamp\":281,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"The direction of your knees and feet should be identical\",\"timestamp\":288,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"The center of your body should be 2/3 towards the back\",\"timestamp\":292,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Move your left foot one step forward\",\"timestamp\":298,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Stand low like you would for Juchumseogi\",\"timestamp\":303,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"direction of your knees and feet should be identical. The center of your body should be\",\"timestamp\":286.4,\"video_id\":\"ksSqKt0UkWo\"}],\"used_in\":[\"taegeuk-3\"]},\"double-punch\":{\"key\":\"double-punch\",\"name\":{\"en\":\"Double Punch\",\"ko\":\"(몸통)안막기\",\"romanized\":\"Dubeon Jireugi\"},\"category\":\"strike\",\"source\":{\"form_id\":\"taegeuk-3\",\"form_name\":\"Taegeuk Sam Jang\",\"video_id\":\"ksSqKt0UkWo\",\"timestamp\":308,\"timestam
