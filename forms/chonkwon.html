xt\":\"Your face, torso, and lower body should be balanced along the center line\",\"timestamp\":186,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Your weight should be placed evenly on both feet\",\"timestamp\":191,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Both elbows should be bent like the internal angles of a hexagram\",\"timestamp\":196,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Your fists should be placed apart about a fist's length\",\"timestamp\":200,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Retain 30% of your breath in the lower abdomen once the preparatory move is complete\",\"timestamp\":206,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Be careful not to raise or tense your shoulders\",\"timestamp\":211,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Begins with Moa Seogi where you can stand and move your left foot about a foot's length to your left.\",\"timestamp\":164.2,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Ulguljireugi is a move where you thrust your fist in a straight line toward the opponent's philtrum\",\"timestamp\":132,\"video_id\":\"tGlrUplKHh8\"},{\"text\":\"Be careful not to let the elbow of your thrusting arm move outward\",\"timestamp\":138,\"video_id\":\"tGlrUplKHh8\"},{\"text\":\"We will now take a closer look at the key move of Taeguk Ija, Olgul Jirugi.\",\"timestamp\":125,\"video_id\":\"tGlrUplKHh8\"},{\"text\":\"Olgul Jirugi is a move where you thrust your fist in a straight line toward the opponent's philtrum.\",\"timestamp\":131.1,\"video_id\":\"tGlrUplKHh8\"},{\"text\":\"That was the key move of Taeguk Ija.\",\"timestamp\":143.4,\"video_id\":\"tGlrUplKHh8\"},{\"text\":\"The hand blade, used in the move, extends from the wrist to the first joint of the little finger\",\"timestamp\":156,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"First open your hand, place the four fingers from the index to the little finger together\",\"timestamp\":163,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Then bend the tip of the thumb and place it on top of the first joint of the index finger\",\"timestamp\":170,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"And bend the tips a little inward\",\"timestamp\":180,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Place the wrist of the thrusting arm at shoulder level, and the supporting arm at the solar plexus level\",\"timestamp\":189,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Perform the Sonal Anchigi move by pulling both elbows towards your body\",\"timestamp\":203,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Place your supporting hand back at the wrist\",\"timestamp\":213,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"The wrist of the striking hand should be straight\",\"timestamp\":219,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"And your hand blade should be raised near your neck level\",\"timestamp\":224,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"These are the four key moves of Taeguk Samjang.\",\"timestamp\":132.3,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Sonal Geodeureomakgi is a technique of defending using two hands where the supporting hand assists when performing Sonal Bakkanmakgi\",\"timestamp\":178,\"video_id\":\"Lt917gacJho\"},{\"text\":\"The hand defending the torso should be placed at the solar plexus level\",\"timestamp\":187,\"video_id\":\"Lt917gacJho\"},{\"text\":\"While the supporting hand should be placed at the elbow level of the defending arm\",\"timestamp\":191,\"video_id\":\"Lt917gacJho\"},{\"text\":\"The elbow of the supporting arm should be placed where it crosses the center line\",\"timestamp\":196,\"video_id\":\"Lt917gacJho\"},{\"text\":\"The space between the outer wrist of the supporting arm and the torso should be about one hand blade\",\"timestamp\":204,\"video_id\":\"Lt917gacJho\"},{\"text\":\"Be careful not to let the elbow rise due to the opening of the armpit of the supporting arm\",\"timestamp\":216,\"video_id\":\"Lt917gacJho\"},{\"text\":\"Tilt your hand outward by 45 degrees\",\"timestamp\":226,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Pull your wrist back as much as possible to concentrate force on the palm of your hand\",\"timestamp\":231,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Your hand should be level with your chin and aligned with the center line\",\"timestamp\":237,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"You can concentrate the force on the palm of your hand when the wrist is tilted 45 degrees outward\",\"timestamp\":243,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Batang Son Apchigi\",\"timestamp\":215.3,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"When performing Bomseogi Sonnal Arae Haecheomagi, both hands should be placed in the center line of the thigh of the front leg.\",\"timestamp\":146.6,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"The back of your hands should each face outward and the space between your hand and body should be about one hand's length sideways.\",\"timestamp\":154.6,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"Start in front of your chest and perform Haecheomagi downward.\",\"timestamp\":162.6,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"When assuming postures where the legs are spread forwards and backwards like Bomseogi and Apgubi,\",\"timestamp\":166.6,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"the arm on the same side as the front foot should cross from the outside.\",\"timestamp\":173.6,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"Gyeop-seon Jun-bi-ja-sae is a preparation posture in which both arms straighten from\",\"timestamp\":166.3,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"Mo-ha-seo-gi.\",\"timestamp\":171.9,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"The left hand is placed over the back of the right hand in the shape of a cross.\",\"timestamp\":173.3,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"The hands should be slightly apart from the body in front of the lower abdomen\",\"timestamp\":179.9,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"with the palm of the left hand placed over the back of the right hand in the\",\"timestamp\":184.7,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"Twist your wrist so that the back of the fist faces downward at the lower abdomen.\",\"timestamp\":246.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"Raise your fists up to your face, then snap your elbow to block upward.\",\"timestamp\":252.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"When blocking, the fist should be placed obliquely above the elbow.\",\"timestamp\":258.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"The space between the back of the wrist and forehead should be about one raised fist length.\",\"timestamp\":264.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"The distance between the fists should be the same.\",\"timestamp\":270.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"Cross the arms so the blocking arm is outside to block the face\",\"timestamp\":175,\"video_id\":\"nur2WsN7dQw\"},{\"text\":\"The hand of the blocking arm rises first\",\"timestamp\":181,\"video_id\":\"nur2WsN7dQw\"},{\"text\":\"Raise the hand first at face elevation and snap the elbow upward to block\",\"timestamp\":185,\"video_id\":\"nur2WsN7dQw\"},{\"text\":\"Pull the opposite fist to the back\",\"timestamp\":189,\"video_id\":\"nur2WsN7dQw\"},{\"text\":\"Cross the hand blade with the center line\",\"timestamp\":194,\"video_id\":\"nur2WsN7dQw\"},{\"text\":\"The space between the blocking arm and forehead should be about one fist\",\"timestamp\":199,\"video_id\":\"nur2WsN7dQw\"},{\"text\":\"Tilt the arm so that the fist faces upward and the elbow faces downward\",\"timestamp\":205,\"video_id\":\"nur2WsN7dQw\"},{\"text\":\"Be careful not to let the elbow of the blocking arm open backwards as this will weaken the arm\",\"timestamp\":212,\"video_id\":\"nur2WsN7dQw\"},{\"text\":\"The elbows should face downward and the armpits should touch the body\",\"timestamp\":208,\"video_id\":\"FBxCzK5c4bE\"},{\"text\":\"Be careful not to let the elbow open outward, creating space under the arm\",\"timestamp\":213,\"video_id\":\"FBxCzK5c4bE\"},{\"text\":\"stabbing the fist of the night,\",\"timestamp\":152,\"video_id\":\"FBxCzK5c4bE\"},{\"text\":\"The tip of the hand must not rise above the shoulder\",\"timestamp\":163,\"video_id\":\"lRp1JE7f-a8\"},{\"text\":\"Attach your armpits to your body to make them firm\",\"timestamp\":167,\"video_id\":\"lRp1JE7f-a8\"},{\"text\":\"The tip of your hand and elbow must be placed in the same line\",\"timestamp\":172,\"video_id\":\"lRp1JE7f-a8\"},{\"text\":\"Cross the arm of the forward foot from the outside\",\"timestamp\":176,\"video_id\":\"lRp1JE7f-a8\"},{\"text\":\"Both hands and arms must move in unison\",\"timestamp\":173,\"video_id\":\"jWClKVOrqJ8\"},{\"text\":\"Both wrists should cross in front of the forehead\",\"timestamp\":188,\"video_id\":\"jWClKVOrqJ8\"},{\"text\":\"When blocking, place your left hand outside\",\"timestamp\":193,\"video_id\":\"jWClKVOrqJ8\"},{\"text\":\"And use your right hand to cross your wrists diagonally\",\"timestamp\":196,\"video_id\":\"jWClKVOrqJ8\"},{\"text\":\"Open the hands and twist your right hand inward\",\"timestamp\":200,\"video_id\":\"jWClKVOrqJ8\"},{\"text\":\"Your left hand outward so the bottom part of your wrists touch each other\",\"timestamp\":203,\"video_id\":\"jWClKVOrqJ8\"},{\"text\":\"To pull an opponent's wrist and thrust or twist their wrist\",\"timestamp\":207,\"video_id\":\"jWClKVOrqJ8\"}],\"used_in\":[\"chonkwon\",\"hansu\",\"ilyeo\",\"jitae\",\"keumgang\",\"pyeongwon\",\"sipjin\",\"taebaek\",\"taegeuk-1\",\"taegeuk-2\",\"taegeuk-3\",\"taegeuk-4\"]},\"knifehand-outward-middle-block\":{\"key\":\"knifehand-outward-middle-block\",\"name\":{\"en\":\"Knifehand Outward Middle Block\",\"ko\":\"손날몸통바깥막기\",\"romanized\":\"02\"},\"category\":\"block\",\"source\":{\"form_id\":\"taegeuk-3\",\"form_name\":\"Taegeuk Sam Jang\",\"video_id\":\"ksSqKt0UkWo\",\"timestamp\":227,\"timestamp_end\":276},\"tips\":[{\"text\":\"The blocking arm's elbow should be straightened in a way that positions your fist above your knees about two fists length\",\"timestamp\":223,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"The wrist on the supporting arm should be straightened so that the back of your hand faces down\",\"timestamp\":231,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"The torso and arm should spin simultaneously\",\"timestamp\":240,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"The blocking arm's elbow should not move in a straight line\",\"timestamp\":245,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Aremaki is a technique used to block an opponent's attack towards the lower body with your outer wrist.\",\"timestamp\":216.3,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Begin with two arms crossed in front of the chest\",\"timestamp\":242,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"The defending arm and supporting arm should be placed on the outside and inside respectively when the arms are crossed\",\"timestamp\":246,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"The tip of the hand of the defending arm should not be above the shoulder when defending\",\"timestamp\":258,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"And the elbow should face downward\",\"timestamp\":262,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Be careful not to let the wrist bend\",\"timestamp\":268,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"And the hand blade should not be outside the end of the line extending from the torso\",\"timestamp\":272,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Sonnal Pakkadmakki is also a technique that uses the hand blade in the same way as the previous\",\"timestamp\":229.7,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"This has the effect of concentrating force in one place with high pressure\",\"timestamp\":231,\"video_id\":\"Lt917gacJho\"},{\"text\":\"As the area of contact with an opponent is small\",\"timestamp\":238,\"video_id\":\"Lt917gacJho\"},{\"text\":\"You can prevent injuries and concentrate your force by placing the index, middle and the ring finger together in a straight line\",\"timestamp\":244,\"video_id\":\"Lt917gacJho\"},{\"text\":\"Be careful not to let your wrist bend\",\"timestamp\":253,\"video_id\":\"Lt917gacJho\"},{\"text\":\"Be careful not to let your wrist bend when performing Jireugi.\",\"timestamp\":253,\"video_id\":\"Lt917gacJho\"},{\"text\":\"The hand blade should be level with the solar plexus\",\"timestamp\":259,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Hand blade aligned with the center line\",\"timestamp\":264,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Be careful not to let the tip of the hand rise above the shoulder\",\"timestamp\":268,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Sonnal Anmakgi\",\"timestamp\":252.1,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"is a technique used to perform Anmakgi with the hand blade.\",\"timestamp\":255.3,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"For Sonnal Oppo Japgi, assume an opponent has hold of you.\",\"timestamp\":178.6,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"Twist the thumb of the hand being held outside.\",\"timestamp\":182.6,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"Then open your hand so the palm is seen from above.\",\"timestamp\":185.6,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"Raise your hand and pull it close to your body to release your wrist.\",\"timestamp\":189.6,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"Open your arm inside out and cover the back of the hand of your opponent.\",\"timestamp\":193.6,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"Par-gum-chi Oryeo-chigi is a technique to strike upward using the elbow.\",\"timestamp\":199.1,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"The basic target is an opponent's chin, but it can also be used to strike the solar\",\"timestamp\":209.4,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"plexus, chest, and other areas.\",\"timestamp\":214.7,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"When performing the move, make sufficient use of the twisting of your torso with\",\"timestamp\":218.9,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"your elbow close to your body.\",\"timestamp\":223.7,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"by placing the whole palm of the other hand on the outer wrist.\",\"timestamp\":301.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"This technique is typically used to perform a strong block with assistance from one arm against a strong attack,\",\"timestamp\":305.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"then quickly connect to the next move.\",\"timestamp\":312.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"The tip of the middle finger of the opposite hand starts at the wrist of the blocking arm.\",\"timestamp\":315.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"Next, gather all your fingers and attach them to the outer wrist.\",\"timestamp\":321.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"swallowing the wings,\",\"timestamp\":156,\"video_id\":\"FBxCzK5c4bE\"},{\"text\":\"Attach the armpit firmly to the body to concentrate force\",\"timestamp\":197,\"video_id\":\"lRp1JE7f-a8\"},{\"text\":\"The fists should be placed slightly over the elbow\",\"timestamp\":201,\"video_id\":\"lRp1JE7f-a8\"},{\"text\":\"Be careful not to let the fists rise excessively\",\"timestamp\":209,\"video_id\":\"lRp1JE7f-a8\"},{\"text\":\"face-to-face, and two-handed push-and-pull,\",\"timestamp\":137,\"video_id\":\"jWClKVOrqJ8\"}],\"used_in\":[\"chonkwon\",\"hansu\",\"ilyeo\",\"jitae\",\"keumgang\",\"pyeongwon\",\"sipjin\",\"taebaek\",\"taegeuk-1\",\"taegeuk-3\",\"taegeuk-4\"]},\"swallow-form-strike\":{\"key\":\"swallow-form-strike\",\"name\":{\"en\":\"Swallow Form Strike\",\"ko\":\"제비품안치기\",\"romanized\":\"03\"},\"category\":\"strike\",\"source\":{\"form_id\":\"taegeuk-4\",\"form_name\":\"Taegeuk Sa Jang\",\"video_id\":\"Lt917gacJho\",\"timestamp\":258,\"timestamp_end\":375},\"tips\":[{\"text\":\"The thrusting arm should be straightened, and your fist should form a straight line with the target's philtrum, solar plexus, lower abdomen, etc.\",\"timestamp\":256,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"The wrist of your supporting arm should be straightened so that the back of your hand faces down and the wrist touches above the waist\",\"timestamp\":265,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"The thrusting arm should move straight forward slightly brushing the waist\",\"timestamp\":274,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"The supporting arm should not be pulled back excessively, pulling the shoulder along with it\",\"timestamp\":286,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"It is important to keep a straight line when punching a target with your fist\",\"timestamp\":297,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"by thrusting with the fist. The thrusting arm should be straightened and your fist should form\",\"timestamp\":254.6,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Your feet should form a 90 degree angle\",\"timestamp\":281,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"The direction of your knees and feet should be identical\",\"timestamp\":288,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"The center of your body should be 2/3 towards the back\",\"timestamp\":292,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Move your left foot one step forward\",\"timestamp\":298,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Stand low like you would for Juchumseogi\",\"timestamp\":303,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"direction of your knees and feet should be identical. The center of your body should be\",\"timestamp\":286.4,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"Perform the preparatory move by placing the left hand in front of the torso, and the wrist of the right hand above the shoulder\",\"timestamp\":268,\"video_id\":\"Lt917gacJho\"},{\"text\":\"Tilt the body about 45 degrees\",\"timestamp\":281,\"video_id\":\"Lt917gacJho\"},{\"text\":\"And then simultaneously perform Oen Sonal Ulgulmakgi and Oreun Sonal Anchigi\",\"timestamp\":285,\"video_id\":\"Lt917gacJho\"},{\"text\":\"The right hand should be placed at the neck level with the elbows slightly bent\",\"timestamp\":293,\"video_id\":\"Lt917gacJho\"},{\"text\":\"The hand that performed Anchigi should be placed at the crossing with the center line in front\",\"timestamp\":301,\"video_id\":\"Lt917gacJho\"},{\"text\":\"And your torso should stand straight\",\"timestamp\":307,\"video_id\":\"Lt917gacJho\"},{\"text\":\"Be careful not to lose balance or let your torso swerve to the right due to excessive twisting\",\"timestamp\":313,\"video_id\":\"Lt917gacJho\"},{\"text\":\"Remove unnecessary force.\",\"timestamp\":280.1,\"video_id\":\"Lt917gacJho\"},{\"text\":\"One arm is used to block the face inside out with the inner wrist\",\"timestamp\":357,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"The other arm is used to block the face outside in with the outer wrist\",\"timestamp\":363,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"The wrists should be level with the philtrum\",\"timestamp\":371,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Elbows should face downward and made perpendicular to the ground without bending the wrist\",\"timestamp\":375,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Geumgang Makgi\",\"timestamp\":274.1,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"For Geumgang Bakalmaki, start with Jangun Doljakui and move together to the center line.\",\"timestamp\":213.6,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"This is a technique where the outer arm performs Olgulmaki\",\"timestamp\":221.6,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"and the inner arm performs Anpalmok Bakalmaki at the same time.\",\"timestamp\":225.6,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"Go-do-ro-ol-gul-yeop-mak-gi\",\"timestamp\":238.6,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"Starts with the Chagin-dol-jogui posture.\",\"timestamp\":241.8,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"The blocking arm should pass the face and the elbow and placed to your side\",\"timestamp\":246.7,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"level with your philtrum.\",\"timestamp\":251.1,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"Your elbow should straighten and be perpendicular to the ground.\",\"timestamp\":253.3,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"by gathering the four fingers straight with the palm facing downward.\",\"timestamp\":346.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"You can attack a pressure point with a strong force as the contact surface of the target becomes smaller\",\"timestamp\":351.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"when struck with your gathered four fingers.\",\"timestamp\":357.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"This move transfers a strong force.\",\"timestamp\":362.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"Be careful to keep the four fingers aligned to avoid injuries to the finger joints.\",\"timestamp\":365.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"yeop pyojok jigi, anpalmok bakkat maki.\",\"timestamp\":151.7,\"video_id\":\"nur2WsN7dQw\"},{\"text\":\"blocking with the whistle,\",\"timestamp\":162,\"video_id\":\"FBxCzK5c4bE\"},{\"text\":\"Kkoduro-kalchebi, Anpal-mok-arae-pyojak-mak-i, Son-nal-geum-gang-mak-i, and Kkyeot-dari-seo-gi.\",\"timestamp\":126.4,\"video_id\":\"lRp1JE7f-a8\"},{\"text\":\"Be careful not to perform the kick after the body has already twisted\",\"timestamp\":233,\"video_id\":\"jWClKVOrqJ8\"}],\"used_in\":[\"chonkwon\",\"hansu\",\"ilyeo\",\"jitae\",\"keumgang\",\"pyeongwon\",\"sipjin\",\"taebaek\",\"taegeuk-1\",\"taegeuk-3\",\"taegeuk-4\"]},\"inward-middle-block\":{\"key\":\"inward-middle-block\",\"name\":{\"en\":\"Inward Middle Block\",\"ko\":\"(몸통)안막기\",\"romanized\":\"04\"},\"category\":\"block\",\"source\":{\"form_id\":\"taegeuk-1\",\"form_name\":\"Taegeuk Il Jang\",\"video_id\":\"WhkjRruCBTo\",\"timestamp\":302,\"timestamp_end\":344},\"tips\":[{\"text\":\"The outer wrist should be level with the solar plexus\",\"timestamp\":309,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"The location of your fist should coincide with the central line\",\"timestamp\":314,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"The hand of your supporting arm should be slightly straightened at the level of the solar plexus\",\"timestamp\":321,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"The hand of the defending arm should protect inwardly; the beginning position is about a fist's length above the shoulder\",\"timestamp\":325,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"The elbow of your defending arm should defend by pulling towards the torso\",\"timestamp\":333,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"The elbow of the supporting arm should be pulled slightly, brushing your waist at the same time\",\"timestamp\":338,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"outside attack using the outer wrist. The outer wrist should be level with the solar plexus\",\"timestamp\":306.4,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Control your breath and quickly perform the Jireugi as if pulling your elbows to your waist\",\"timestamp\":318,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"The force exerted and speed of your arms must be in balance\",\"timestamp\":323,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"in succession. Control your breath and quickly perform the Jirugi as if pulling your elbows\",\"timestamp\":313.6,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"to your waist. The force exerted and speed of your arms must be in balance. These are\",\"timestamp\":321.1,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"the four key moves of Taeguk Samjang. We will now look at the moves in succession connecting\",\"timestamp\":330.2,\"video_id\":\"ksSqKt0UkWo\"},{\"text\":\"The kicking leg should be raised higher than the supporting knee, above the waist\",\"timestamp\":329,\"video_id\":\"Lt917gacJho\"},{\"text\":\"Bend your knee, twist your pelvis, and straighten your leg to kick\",\"timestamp\":335,\"video_id\":\"Lt917gacJho\"},{\"text\":\"Your shoulder, hips and heel should form a straight line\",\"timestamp\":348,\"video_id\":\"Lt917gacJho\"},{\"text\":\"Be careful not to let the heel of your supporting leg twist too early in the direction of the kick\",\"timestamp\":353,\"video_id\":\"Lt917gacJho\"},{\"text\":\"These are the five key moves of Taeguk Sajang.\",\"timestamp\":163.4,\"video_id\":\"Lt917gacJho\"},{\"text\":\"Geumdol Jogui\",\"timestamp\":320,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Place the wrist of one arm at the lilac crest\",\"timestamp\":323.2,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"and the other arm in front of the solar plexus.\",\"timestamp\":326.2,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"The space between the arm on top and the torso\",\"timestamp\":329.8,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"should be about one raised fist.\",\"timestamp\":332.8,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Turoppegi is a technique where you spin the thumb toward the inner wrist\",\"timestamp\":230.6,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"and release between an opponent's thumb and index finger.\",\"timestamp\":235.6,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"When performing Olgulpakachigi, strengthen the shoulder and shoulder blade\",\"timestamp\":240.9,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"Dangyeo-deung-joo-mok-ap-chigi is a technique to pull an opponent with one\",\"timestamp\":278.1,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"hand and strike their face in the philtrum or chin forward from the inside\",\"timestamp\":282.5,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"using the other back fist.\",\"timestamp\":288.1,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"It can also be used to attack other areas depending on the situation.\",\"timestamp\":290.8,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"The back fist is placed in front of the philtrum.\",\"timestamp\":297.1,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"then push in a straight line using your palms.\",\"timestamp\":398.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"Bend the wrists naturally and keep your thumb close to your hand.\",\"timestamp\":406.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"Your left arm is placed obliquely with a space of one hand span between the back of your hand and forehead.\",\"timestamp\":411.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"Your right hand is symmetrically placed slightly below your left hand with a one-fist space between.\",\"timestamp\":419.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"Opening the elbow weakens the shoulder, so exert force while you tighten the elbows and straighten the body.\",\"timestamp\":428.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"We will now take a closer look at each of the key moves of jite pumsae.\",\"timestamp\":163.6,\"video_id\":\"nur2WsN7dQw\"},{\"text\":\"Sonnal olgul maki is, as the name suggests, a technique to block the face upwards with\",\"timestamp\":168.7,\"video_id\":\"nur2WsN7dQw\"},{\"text\":\"both arms.\",\"timestamp\":174.3,\"video_id\":\"nur2WsN7dQw\"},{\"text\":\"Cross the arms so the blocking arm is outside to block the face.\",\"timestamp\":175.9,\"video_id\":\"nur2WsN7dQw\"},{\"text\":\"The hand of the blocking arm rises first.\",\"timestamp\":180.9,\"video_id\":\"nur2WsN7dQw\"},{\"text\":\"pulling with the whistle,\",\"timestamp\":168,\"video_id\":\"FBxCzK5c4bE\"},{\"text\":\"and two-handed push-and-pull.\",\"timestamp\":149,\"video_id\":\"jWClKVOrqJ8\"},{\"text\":\"We will now take a closer look at each of the key moves of Ilyopumse.\",\"timestamp\":155,\"video_id\":\"jWClKVOrqJ8\"},{\"text\":\"Weisanteu-yopchagi is a technique to cross the two arms in front of the chest\",\"timestamp\":160,\"video_id\":\"jWClKVOrqJ8\"},{\"text\":\"and slowly perform anpalmok-bakkatmakgi and mejumok-bakkatjigi simultaneously.\",\"timestamp\":166,\"video_id\":\"jWClKVOrqJ8\"},{\"text\":\"Both hands and arms must move in unison.\",\"timestamp\":173,\"video_id\":\"jWClKVOrqJ8\"}],\"used_in\":[\"chonkwon\",\"hansu\",\"ilyeo\",\"jitae\",\"keumgang\",\"koryo\",\"pyeongwon\",\"sipjin\",\"taebaek\",\"taegeuk-1\",\"taegeuk-2\",\"taegeuk-3\",\"taegeuk-4\"]},\"upper-block\":{\"key\":\"upper-block\",\"name\":{\"en\":\"Upper Block\",\"ko\":\"올려(얼굴)막기\",\"romanized\":\"05\"},\"category\":\"block\",\"source\":{\"form_id\":\"taegeuk-1\",\"form_name\":\"Taegeuk Il Jang\",\"video_id\":\"WhkjRruCBTo\",\"timestamp\":344,\"timestamp_end\":376},\"tips\":[{\"text\":\"Cross your arms in front of your solar plexus, and protect from an opponent's attack by raising them upwards\",\"timestamp\":352,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"The fist on the defending arm should be above the elbow\",\"timestamp\":358,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"The arm should be tilted with a space about the size of a fist between the back of the wrist and the forehead\",\"timestamp\":362,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Be careful not to raise your arm excessively\",\"timestamp\":370,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"by raising your outer wrist. Cross your arms in front of your solar plexus and protect from\",\"timestamp\":349.4,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Your arms should cross at the solar plexus level, and the striking fist should pass under the supporting arm, making an arc\",\"timestamp\":386,\"video_id\":\"Lt917gacJho\"},{\"text\":\"The back of the fist should be at the philtrum level along the center line when seen from the front\",\"timestamp\":394,\"video_id\":\"Lt917gacJho\"},{\"text\":\"Be careful not to let the elbow of the striking arm point outward\",\"timestamp\":403,\"video_id\":\"Lt917gacJho\"},{\"text\":\"These are the five key moves of Taeguk Sajang.\",\"timestamp\":407,\"video_id\":\"Lt917gacJho\"},{\"text\":\"We will now look at the moves in succession, connecting each move.\",\"timestamp\":412.2,\"video_id\":\"Lt917gacJho\"},{\"text\":\"We will now take a closer look at each of the key moves of Geumgang Pumsae.\",\"timestamp\":208.5,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"by bending the elbow and utilize the torque of the torso.\",\"timestamp\":245.9,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"The elbow should face downward and the fist raised level with the temple.\",\"timestamp\":249.9,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"Be careful not to bend the elbow.\",\"timestamp\":255.9,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"These are the five key moves of Taebaek Pumsae.\",\"timestamp\":258.9,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"We will now look at the moves in succession connecting each move.\",\"timestamp\":262.9,\"video_id\":\"Q4dYdFRbE4U\"},{\"text\":\"Mong-ae-chigi is a technique used to attack both sides using the elbow\",\"timestamp\":307,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"by crossing your arms above and below in front of the chest.\",\"timestamp\":315,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"Your back fist must face upward, and the back of your two hammer fists should\",\"timestamp\":320.3,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"lightly touch your chest.\",\"timestamp\":324.9,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"Your arms must be parallel.\",\"timestamp\":327.8,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"You can use the back of the hand blade to strike and block, absorb and block, and wind and grab an opponent's arm.\",\"timestamp\":467.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"Your elbow should face downward, and your armpit should lightly touch the body.\",\"timestamp\":476.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"The tip of your hand must not rise above your shoulder.\",\"timestamp\":483.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"Your armpit should not open due to your elbow rising or moving far away from the body.\",\"timestamp\":487.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"The back of your hand blade must go outside the shoulder line.\",\"timestamp\":493.9,\"video_id\":\"hOZB0IESJ38\"},{\"text\":\"stabbing the side of the golden river,\",\"timestamp\":172,\"video_id\":\"FBxCzK5c4bE\"},{\"text\":\"pushing the mountain,\",\"timestamp\":176,\"video_id\":\"FBxCzK5c4bE\"}],\"used_in\":[\"chonkwon\",\"hansu\",\"keumgang\",\"pyeongwon\",\"sipjin\",\"taebaek\",\"taegeuk-1\",\"taegeuk-4\"]},\"crane-stance\":{\"key\":\"crane-stance\",\"name\":{\"en\":\"Crane Stance\",\"ko\":\"학다리서기\",\"romanized\":\"06\"},\"category\":\"stance\",\"source\":{\"form_id\":\"keumgang\",\"form_name\":\"Keumgang\",\"video_id\":\"CRGVSOmaQaY\",\"timestamp\":384,\"timestamp_end\":444},\"tips\":[{\"text\":\"The kick should be made with your leg bent so that the kicking leg starts on top of the knee of your supporting leg\",\"timestamp\":384,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"The forward kicking leg should be bent in a way where your front sole touches the ground first\",\"timestamp\":392,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Train this technique using coordination of the upper and lower body\",\"timestamp\":402,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"in a straight line. The kick should be made with your leg bent so that the kicking leg starts on\",\"timestamp\":381.8,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"top of the knee of your supporting leg. The forward kicking leg should be bent in a way where your\",\"timestamp\":388.8,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Maintain balance with one leg\",\"timestamp\":396,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Bend and raise the other knee\",\"timestamp\":400,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Lightly touch the arch of the back of the foot blade inside the supporting leg\",\"timestamp\":405,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Face forward so your knees don't open outward\",\"timestamp\":413,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Naturally straighten the ankle of the leg inside the knee of the supporting leg\",\"timestamp\":418,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Hakdari Sange\",\"timestamp\":386.1,\"video_id\":\"CRGVSOmaQaY\"},{\"text\":\"Hae-choo-san-teul-mak-i is a technique where your arms cross at the lower abdomen\",\"timestamp\":343.9,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"and move your sides horizontally in front of your face to perform ol-geul-hae-choo-mak-i\",\"timestamp\":351.4,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"with your inner wrist.\",\"timestamp\":357,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"Your arms should be at the philtrum level and perpendicular to the ground.\",\"timestamp\":359.9,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"Be careful not to let the wrist bend and the blocking arm must not tilt front, back,\",\"timestamp\":366.4,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"We will now take a closer look at each of the key moves of Honsu Pumse.\",\"timestamp\":145.4,\"video_id\":\"lRp1JE7f-a8\"},{\"text\":\"Son-nal-deung-hae-cheon-mak-i is a technique to cross the two hands in front of the chest\",\"timestamp\":150.1,\"video_id\":\"lRp1JE7f-a8\"},{\"text\":\"and block by scattering them sideways.\",\"timestamp\":156.1,\"video_id\":\"lRp1JE7f-a8\"},{\"text\":\"When performing Momtong-hae-cheon-mak-i, the tip of the hand must not rise above the shoulder.\",\"timestamp\":160.1,\"video_id\":\"lRp1JE7f-a8\"},{\"text\":\"Attach your armpits to your body to make them firm and the tip of your hand and elbow must\",\"timestamp\":168.3,\"video_id\":\"lRp1JE7f-a8\"}],\"used_in\":[\"chonkwon\",\"hansu\",\"keumgang\",\"pyeongwon\",\"sipjin\",\"taegeuk-1\"]},\"jajeunbal\":{\"key\":\"jajeunbal\",\"name\":{\"en\":\"Jajeunbal\",\"ko\":\"자전발\",\"romanized\":\"07\"},\"category\":\"stance\",\"source\":{\"form_id\":\"pyeongwon\",\"form_name\":\"Pyeongwon\",\"video_id\":\"RB-7mBtvtZw\",\"timestamp\":375,\"timestamp_end\":435},\"tips\":[{\"text\":\"Naranhiseogi consists of keeping your feet parallel so that the back of the foot blades face each other\",\"timestamp\":412,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"straightening your knees and stand naturally as if stopping after walking. The center of\",\"timestamp\":416.2,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"your body should be placed in between your feet, the chest relaxed. The distance between your feet\",\"timestamp\":422.2,\"video_id\":\"WhkjRruCBTo\"},{\"text\":\"Mo-ha-seo-gi is a posture where the back of the foot blades are adjacent to\",\"timestamp\":375.7,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"and the knees are straightened and aligned to the center line.\",\"timestamp\":380.6,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"Your eyes should be directed forward and be careful not to let space exist between your feet.\",\"timestamp\":385.4,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"These are the 7 key moves of pyeong-won-poom-se.\",\"timestamp\":392.2,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"We will now look at the moves in succession connecting each move.\",\"timestamp\":398.3,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"Maintain the Dwitgubi posture by pulling your left foot the moment your right foot pushes and sets forward about a half step\",\"timestamp\":351,\"video_id\":\"FBxCzK5c4bE\"},{\"text\":\"We will now take a closer look at each of the key moves of Cheonggwan Pumsae.\",\"timestamp\":188,\"video_id\":\"FBxCzK5c4bE\"},{\"text\":\"Bamjumeokjijirigi is a technique to thrust and strike a target at chin elevation from the waist up using the knuckle fist.\",\"timestamp\":194,\"video_id\":\"FBxCzK5c4bE\"},{\"text\":\"The elbows should face downward,\",\"timestamp\":204,\"video_id\":\"FBxCzK5c4bE\"},{\"text\":\"and the armpits should touch the ground.\",\"timestamp\":206,\"video_id\":\"FBxCzK5c4bE\"}],\"used_in\":[\"chonkwon\",\"pyeongwon\",\"sipjin\",\"taegeuk-1\"]},\"double-uppercut-punch\":{\"key\":\"double-uppercut-punch\",\"name\":{\"en\":\"Double Uppercut Punch\",\"ko\":\"두밤주먹치올려지르기\",\"romanized\":\"Dubamjumeok Chi Ollyeo Jireugi\"},\"category\":\"strike\",\"source\":{\"form_id\":\"taegeuk-7\",\"form_name\":\"Taegeuk Chil Jang\",\"video_id\":\"6FUM1p6qqhQ\",\"timestamp\":397,\"timestamp_end\":452},\"tips\":[{\"text\":\"Dujumok chocho jirugi is a technique used to bend back and thrust by pointing the back of your hand downward.\",\"timestamp\":398.7,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"Your two fists start at the back with the backs of your hands facing upward and thrust downward after bending back.\",\"timestamp\":406.7,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"The key targets are jeonggwang and hyopbok pressure points.\",\"timestamp\":414.7,\"vi
