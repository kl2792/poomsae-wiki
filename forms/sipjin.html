\"},{\"text\":\"Your arms should be at the philtrum level and perpendicular to the ground\",\"timestamp\":359,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"Be careful not to let the wrist bend\",\"timestamp\":365,\"video_id\":\"RB-7mBtvtZw\"},{\"text\":\"The blocking arm must not tilt front/back, left/right\",\"timestamp\":369,\"video_id\":\"RB-7mBtvtZw\"}],\"used_in\":[\"pyeongwon\",\"sipjin\"]},\"ready-stance\":{\"key\":\"ready-stance\",\"name\":{\"en\":\"Ready Stance\",\"ko\":\"준비\",\"romanized\":\"Junbi\"},\"category\":\"stance\",\"source\":{\"form_id\":\"taegeuk-2\",\"form_name\":\"Taegeuk I Jang\",\"video_id\":\"tGlrUplKHh8\",\"timestamp\":115},\"tips\":[],\"used_in\":[\"hansu\",\"ilyeo\",\"jitae\",\"keumgang\",\"pyeongwon\",\"sipjin\",\"taebaek\",\"taegeuk-2\",\"taegeuk-3\",\"taegeuk-4\",\"taegeuk-5\",\"taegeuk-6\",\"taegeuk-7\",\"taegeuk-8\"]},\"diamond-middle-punch\":{\"key\":\"diamond-middle-punch\",\"name\":{\"en\":\"Diamond Middle Punch\",\"ko\":\"금강 몸통지르기\",\"romanized\":\"Geumgang Momtong Jireugi\"},\"category\":\"strike\",\"source\":{\"form_id\":\"jitae\",\"form_name\":\"Jitae\",\"video_id\":\"nur2WsN7dQw\",\"timestamp\":145},\"tips\":[],\"used_in\":[\"jitae\",\"sipjin\"]},\"knifehand-low-block\":{\"key\":\"knifehand-low-block\",\"name\":{\"en\":\"Knifehand Low Block\",\"ko\":\"손날 아래막기\",\"romanized\":\"Sonnal Arae Makgi\"},\"category\":\"block\",\"source\":{\"form_id\":\"koryo\",\"form_name\":\"Koryo\",\"video_id\":\"mGa60JDtWmg\",\"timestamp\":364},\"tips\":[{\"text\":\"It can also be used to strike and block an opponent's attack by opening the hand\",\"timestamp\":370,\"video_id\":\"mGa60JDtWmg\"},{\"text\":\"Also used as Badamakgi and Geodeomakgi\",\"timestamp\":377,\"video_id\":\"mGa60JDtWmg\"}],\"used_in\":[\"koryo\",\"sipjin\"]},\"knifehand-assisted-low-block\":{\"key\":\"knifehand-assisted-low-block\",\"name\":{\"en\":\"Knifehand Assisted Low Block\",\"ko\":\"손날거들어아래막기\",\"romanized\":\"Sonnal Geodeureo Arae Makgi\"},\"category\":\"block\",\"sourc
