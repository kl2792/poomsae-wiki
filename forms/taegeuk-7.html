er body swerving front and back, left and right\",\"timestamp\":825,\"video_id\":\"6FUM1p6qqhQ\"}],\"used_in\":[\"taegeuk-4\",\"taegeuk-5\",\"taegeuk-7\"]},\"elbow-target-strike\":{\"key\":\"elbow-target-strike\",\"name\":{\"en\":\"Elbow Target Strike\",\"ko\":\"팔꿈치표적치기\",\"romanized\":\"Palggumchi Pyojeokchigi\"},\"category\":\"strike\",\"source\":{\"form_id\":\"taegeuk-5\",\"form_name\":\"Taegeuk Oh Jang\",\"video_id\":\"VdqNEAHWCBM\",\"timestamp\":246,\"timestamp_end\":278},\"tips\":[{\"text\":\"The elbow of the arm creating a target should be slightly bent and at solar plexus elevation\",\"timestamp\":259,\"video_id\":\"VdqNEAHWCBM\"},{\"text\":\"Be careful not to let the palm of the assisting hand hit your elbow or hold your elbow with your hand\",\"timestamp\":267,\"video_id\":\"VdqNEAHWCBM\"},{\"text\":\"The target must not wrap around the elbow\",\"timestamp\":1173,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"It is important to perform Pyojeokchagi and Pyojeokchigi in succession\",\"timestamp\":1177,\"video_id\":\"6FUM1p6qqhQ\"}],\"used_in\":[\"pyeongwon\",\"taegeuk-5\",\"taegeuk-7\"]},\"side-block\":{\"key\":\"side-block\",\"name\":{\"en\":\"Side Block\",\"ko\":\"옆막기\",\"romanized\":\"Yeop Makgi\"},\"category\":\"block\",\"source\":{\"form_id\":\"taegeuk-1\",\"form_name\":\"Taegeuk Il Jang\",\"video_id\":\"WhkjRruCBTo\",\"timestamp\":217,\"timestamp_end\":253},\"tips\":[],\"used_in\":[\"taegeuk-7\"]}}}]}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"11:I[866034,[\"/poomsae-wiki/_next/static/chunks/0v2f~dy~9~ykz.js\",\"/poomsae-wiki/_next/static/chunks/0skzqwqsq3uz~.js\"],\"IconMark\"]\n8:null\nd:[[\"$\",\"title\",\"0\",{\"children\":\"Poomsae Wiki — WT Taekwondo Forms Reference\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive reference for al
