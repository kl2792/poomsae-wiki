,\"category\":\"block\",\"video_timestamp\":177,\"tips\":[{\"text\":\"The space between the outer wrist and torso should be about one hand blade apart\",\"timestamp\":211},{\"text\":\"Be careful not to let your blocking hand move outside the line connecting your leg and body\",\"timestamp\":223},{\"text\":\"The assisting armpit should not detach from your body, making the elbow rise up\",\"timestamp\":227},{\"text\":\"The blocking hand is placed over the knee forward about two-fists length apart.\",\"timestamp\":187.7,\"source\":\"caption\"},{\"text\":\"The assisting hand is raised to the same level as the elbow of the arm blocking the lower body.\",\"timestamp\":194.7,\"source\":\"caption\"}],\"video_timestamp_end\":234},{\"key\":\"augmented-palm-middle-inward-block\",\"name\":{\"en\":\"Augmented Palm Middle Inward Block\",\"ko\":\"거들어바탕손몸통안막기\",\"romanized\":\"Geodeureo Batangson Momtong An Makki\"},\"category\":\"block\",\"video_timestamp\":234,\"tips\":[{\"text\":\"Start your blocking hand one hand's length above your shoulder, and block inwards\",\"timestamp\":251},{\"text\":\"The back of the assisting hand should point upward\",\"timestamp\":265},{\"text\":\"When initiating this move, straighten the assisting arm slightly at the solar plexus level.\",\"timestamp\":239.6,\"source\":\"caption\"},{\"text\":\"Place the palm of your hand on the blocking arm in front of the solar plexus.\",\"timestamp\":256.1,\"source\":\"caption\"},{\"text\":\"Block by pulling the elbow of the blocking arm towards the body and pull your assisting arm.\",\"timestamp\":272,\"source\":\"caption\"}],\"video_timestamp_end\":288},{\"key\":\"covered-fist\",\"name\":{\"en\":\"Covered Fist\",\"ko\":\"보주먹\",\"romanized\":\"Bojumeok\"},\"category\":\"strike\",\"video_timestamp\":288,\"tips\":[{\"text\":\"The four fingers of your left hand wrap around the four fingers of your right fist.\",\"timestamp\":296.2,\"source\":\"caption\"},{\"text\":\"The left thumb wraps around the right thumb.\",\"timestamp\":303.2,\"source\":\"caption\"},{\"text\":\"The space between your fists should be a sheet of paper's width.\",\"timestamp\":309.3,\"source\":\"caption\"},{\"text\":\"The assisting fist starts in front of the lower abdomen and is raised to the front of the philtrum passing the front of the chest.\",\"timestamp\":313.3,\"source\":\"caption\"},{\"text\":\"The internal angle of your arm should be between 90 degrees and 120 degrees.\",\"timestamp\":322.8,\"source\":\"caption\"}],\"video_timestamp_end\":328},{\"key\":\"scissors-block\",\"name\":{\"en\":\"Scissors Block\",\"ko\":\"가위막기\",\"romanized\":\"Gawimakgi\"},\"category\":\"block\",\"video_timestamp\":328,\"tips\":[{\"text\":\"The space between your fists should be a sheet of paper's width\",\"timestamp\":308},{\"text\":\"The internal angle of your arm should be between 90 and 120 degrees\",\"timestamp\":322},{\"text\":\"Kawimaki is a maki move that performs anpalmok bakatmaki and aremaki at the same time.\",\"timestamp\":329.8,\"source\":\"caption\"},{\"text\":\"It starts with both arms crossed in front of the chest.\",\"timestamp\":338.8,\"source\":\"caption\"},{\"text\":\"The wrist of the arm performing anpalmok bakatmaki should be placed at the solar plexus level and your fist must not rise above your shoulder.\",\"timestamp\":342.8,\"source\":\"caption\"}],\"video_timestamp_end\":360},{\"key\":\"knee-strike\",\"name\":{\"en\":\"Knee Strike\",\"ko\":\"무릎치기\",\"romanized\":\"Mureupchigi\"},\"category\":\"strike\",\"video_timestamp\":360,\"tips\":[{\"text\":\"The wrist of the arm performing Anpalmok Bakkanmakgi should be placed at the solar plexus level\",\"timestamp\":345},{\"text\":\"Your fist must not rise above your shoulder\",\"timestamp\":349},{\"text\":\"Murubchigi is a technique used to kick upwards with the knee by folding the leg.\",\"timestamp\":361.1,\"source\":\"caption\"},{\"text\":\"Kick upwards with your knee folded as much as possible.\",\"timestamp\":367.1,\"source\":\"caption\"},{\"text\":\"Hechomaki is a technique used to block inside out simultaneously by crossing your wrists in front of your chest.\",\"timestamp\":372.6,\"source\":\"caption\"}],\"video_timestamp_end\":375},{\"key\":\"middle-spreading-block\",\"name\":{\"en\":\"Middle Spreading Block\",\"ko\":\"몸통헤쳐막기\",\"romanized\":\"Momtong Hecheomakgi\"},\"category\":\"block\",\"video_timestamp\":375,\"tips\":[{\"text\":\"Your fists must be in front of your shoulders when blocking.\",\"timestamp\":385.3,\"source\":\"caption\"},{\"text\":\"Your elbows should point downward and your two armpits should softly touch your torso.\",\"timestamp\":390.6,\"source\":\"caption\"}],\"video_timestamp_end\":397},{\"key\":\"double-fist-uppercut\",\"name\":{\"en\":\"Double Fist Uppercut\",\"ko\":\"두주먹제쳐지르기\",\"romanized\":\"Dujumeok Jeocheojireugi\"},\"category\":\"strike\",\"video_timestamp\":397,\"tips\":[{\"text\":\"Dujumok chocho jirugi is a technique used to bend back and thrust by pointing the back of your hand downward.\",\"timestamp\":398.7,\"source\":\"caption\"},{\"text\":\"Your two fists start at the back with the backs of your hands facing upward and thrust downward after bending back.\",\"timestamp\":406.7,\"source\":\"caption\"},{\"text\":\"The key targets are jeonggwang and hyopbok pressure points.\",\"timestamp\":414.7,\"source\":\"caption\"},{\"text\":\"When thrusting, keep your arms in touching the torso and place your elbows close to your torso.\",\"timestamp\":422.1,\"source\":\"caption\"},{\"text\":\"Chocho jirugi should be performed by thrusting upwards slightly from below.\",\"timestamp\":430.7,\"source\":\"caption\"}],\"video_timestamp_end\":452},{\"key\":\"cross-low-block\",\"name\":{\"en\":\"Cross Low Block\",\"ko\":\"엇걸어아래막기\",\"romanized\":\"Utgeoreo Arae Makki\"},\"category\":\"block\",\"video_timestamp\":452,\"tips\":[{\"text\":\"Otkoro aremaki is a technique used to block in front of the lower abdomen by making a diagonal loop with the two wrists.\",\"timestamp\":452.2,\"source\":\"caption\"},{\"text\":\"For Wen Apgubi, start with your right arm back and cross your right arm upwards.\",\"timestamp\":463.2,\"source\":\"caption\"},{\"text\":\"For Oren Apgubi, start with your left arm back and cross your left arm upwards.\",\"timestamp\":473.1,\"source\":\"caption\"},{\"text\":\"Both elbows should be touching your torso.\",\"timestamp\":482.1,\"source\":\"caption\"}],\"video_timestamp_end\":486},{\"key\":\"backfist-outward-strike\",\"name\":{\"en\":\"Back Fist Outward Strike\",\"ko\":\"등주먹바깥치기\",\"romanized\":\"Deungjumeok Bakkanchigi\"},\"category\":\"strike\",\"video_timestamp\":486,\"tips\":[{\"text\":\"Dujumok pakachigi starts with the first of the opposite shoulder.\",\"timestamp\":487.1,\"source\":\"caption\"},{\"text\":\"The assisting arm should cross below the thrusting arm to initiate the preparatory move.\",\"timestamp\":496.1,\"source\":\"caption\"},{\"text\":\"Then strike a target with the back of your fist using the torque of your torso.\",\"timestamp\":503.1,\"source\":\"caption\"}],\"video_timestamp_end\":510},{\"key\":\"target-kick\",\"name\":{\"en\":\"Target Kick\",\"ko\":\"표적차기\",\"romanized\":\"Pyojeokchagi\"},\"category\":\"kick\",\"video_timestamp\":510,\"tips\":[{\"text\":\"Your fist should align with your shoulder line and your elbow should be naturally straight.\",\"timestamp\":511.2,\"source\":\"caption\"},{\"text\":\"Pyojokchagi is a technique used to create a target with the palm of your hand.\",\"timestamp\":522.3,\"source\":\"caption\"},{\"text\":\"Kick outside in using the foot blade.\",\"timestamp\":529.8,\"source\":\"caption\"},{\"text\":\"Be careful not to kick with the sole of your foot.\",\"timestamp\":535.8,\"source\":\"caption\"}],\"video_timestamp_end\":540},{\"key\":\"side-punch\",\"name\":{\"en\":\"Side Punch\",\"ko\":\"옆지르기\",\"romanized\":\"Yeopjireugi\"},\"category\":\"strike\",\"video_timestamp\":540,\"tips\":[{\"text\":\"Is a technique used to thrust sideways while standing sideways like Jujumsogi.\",\"timestamp\":544.7,\"source\":\"caption\"},{\"text\":\"The flow of force progress transferred from the ground is pushed up to the fist through the elbow.\",\"timestamp\":552.6,\"source\":\"caption\"},{\"text\":\"Bumsogi posture is achieved by shifting your weight on your hind leg\",\"timestamp\":558.6,\"source\":\"caption\"}],\"video_timestamp_end\":570},{\"key\":\"tiger-stance\",\"name\":{\"en\":\"Tiger Stance\",\"ko\":\"범서기\",\"romanized\":\"Beomseogi\"},\"category\":\"stance\",\"video_timestamp\":570,\"tips\":[{\"text\":\"and standing low after setting your front foot forward about a foot length from the tip of the big toe to your hind foot.\",\"timestamp\":570.5,\"source\":\"caption\"},{\"text\":\"Raise your heel so only the ball of the front foot touches the ground\",\"timestamp\":578.5,\"source\":\"caption\"},{\"text\":\"and support your weight with your hind leg so that your weight is distributed equally on both your hind and front leg 9 to 1.\",\"timestamp\":587.7,\"source\":\"caption\"},{\"text\":\"Slowly tighten legs inward and stand with your knees tilted forward.\",\"timestamp\":598.3,\"source\":\"caption\"}],\"video_timestamp_end\":600},{\"key\":\"horse-stance\",\"name\":{\"en\":\"Horse Stance\",\"ko\":\"주춤서기\",\"romanized\":\"Juchumseogi\"},\"category\":\"stance\",\"video_timestamp\":600,\"tips\":[{\"text\":\"Be careful not to let your upper body move too much forward or backward.\",\"timestamp\":604.3,\"source\":\"caption\"},{\"text\":\"The last of the 13 key movements is Jujumsogi.\",\"timestamp\":610.3,\"source\":\"caption\"},{\"text\":\"Jujumsogi posture is achieved by keeping the tops of your feet parallel about two feet length apart, standing low.\",\"timestamp\":614.3,\"source\":\"caption\"},{\"text\":\"These are the 13 key moves of Taegukchijang.\",\"timestamp\":625.1,\"source\":\"caption\"},{\"text\":\"We will now look at the moves in succession, connecting each move.\",\"timestamp\":630.4,\"source\":\"caption\"}],\"video_timestamp_end p6qqhQ\"},{\"text\":\"Your fist must not rise above your shoulder\",\"timestamp\":349,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"Murubchigi is a technique used to kick upwards with the knee by folding the leg.\",\"timestamp\":361.1,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"Kick upwards with your knee folded as much as possible.\",\"timestamp\":367.1,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"Hechomaki is a technique used to block inside out simultaneously by crossing your wrists in front of your chest.\",\"timestamp\":372.6,\"video_id\":\"6FUM1p6qqhQ\"}],\"used_in\":[\"taegeuk-7\"]},\"middle-spreading-block\":{\"key\":\"middle-spreading-block\",\"name\":{\"en\":\"Middle Spreading Block\",\"ko\":\"몸통헤쳐막기\",\"romanized\":\"Momtong Hecheomakgi\"},\"category\":\"block\",\"source\":{\"form_id\":\"taegeuk-7\",\"form_name\":\"Taegeuk Chil Jang\",\"video_id\":\"6FUM1p6qqhQ\",\"timestamp\":375,\"timestamp_end\":397},\"tips\":[{\"text\":\"Your fists must be in front of your shoulders when blocking.\",\"timestamp\":385.3,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"Your elbows should point downward and your two armpits should softly touch your torso.\",\"timestamp\":390.6,\"video_id\":\"6FUM1p6qqhQ\"}],\"used_in\":[\"taegeuk-7\"]},\"double-fist-uppercut\":{\"key\":\"double-fist-uppercut\",\"name\":{\"en\":\"Double Fist Uppercut\",\"ko\":\"두주먹제쳐지르기\",\"romanized\":\"Dujumeok Jeocheojireugi\"},\"category\":\"strike\",\"source\":{\"form_id\":\"taegeuk-7\",\"form_name\":\"Taegeuk Chil Jang\",\"video_id\":\"6FUM1p6qqhQ\",\"timestamp\":397,\"timestamp_end\":452},\"tips\":[{\"text\":\"Dujumok chocho jirugi is a technique used to bend back and thrust by pointing the back of your hand downward.\",\"timestamp\":398.7,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"Your two fists start at the back with the backs of your hands facing upward and thrust downward after bending back.\",\"timestamp\":406.7,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"The key targets are jeonggwang and hyopbok pressure points.\",\"timestamp\":414.7,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"When thrusting, keep your arms in touching the torso and place your elbows close to your torso.\",\"timestamp\":422.1,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"Chocho jirugi should be performed by thrusting upwards slightly from below.\",\"timestamp\":430.7,\"video_id\":\"6FUM1p6qqhQ\"}],\"used_in\":[\"hansu\",\"taegeuk-7\"]},\"cross-low-block\":{\"key\":\"cross-low-block\",\"name\":{\"en\":\"Cross Low Block\",\"ko\":\"엇걸어아래막기\",\"romanized\":\"Utgeoreo Arae Makki\"},\"category\":\"block\",\"source\":{\"form_id\":\"taegeuk-7\",\"form_name\":\"Taegeuk Chil Jang\",\"video_id\":\"6FUM1p6qqhQ\",\"timestamp\":452,\"timestamp_end\":486},\"tips\":[{\"text\":\"Otkoro aremaki is a technique used to block in front of the lower abdomen by making a diagonal loop with the two wrists.\",\"timestamp\":452.2,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"For Wen Apgubi, start with your right arm back and cross your right arm upwards.\",\"timestamp\":463.2,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"For Oren Apgubi, start with your left arm back and cross your left arm upwards.\",\"timestamp\":473.1,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"Both elbows should be touching your torso.\",\"timestamp\":482.1,\"video_id\":\"6FUM1p6qqhQ\"}],\"used_in\":[\"taegeuk-7\"]},\"backfist-outward-strike\":{\"key\":\"backfist-outward-strike\",\"name\":{\"en\":\"Back Fist Outward Strike\",\"ko\":\"등주먹바깥치기\",\"romanized\":\"Deungjumeok Bakkanchigi\"},\"category\":\"strike\",\"source\":{\"form_id\":\"taegeuk-7\",\"form_name\":\"Taegeuk Chil Jang\",\"video_id\":\"6FUM1p6qqhQ\",\"timestamp\":486,\"timestamp_end\":510},\"tips\":[{\"text\":\"Dujumok pakachigi starts with the first of the opposite shoulder.\",\"timestamp\":487.1,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"The assisting arm should cross below the thrusting arm to initiate the preparatory move.\",\"timestamp\":496.1,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"Then strike a target with the back of your fist using the torque of your torso.\",\"timestamp\":503.1,\"video_id\":\"6FUM1p6qqhQ\"}],\"used_in\":[\"taebaek\",\"taegeuk-7\"]},\"target-kick\":{\"key\":\"target-kick\",\"name\":{\"en\":\"Target Kick\",\"ko\":\"표적차기\",\"romanized\":\"Pyojeokchagi\"},\"category\":\"kick\",\"source\":{\"form_id\":\"taegeuk-7\",\"form_name\":\"Taegeuk Chil Jang\",\"video_id\":\"6FUM1p6qqhQ\",\"timestamp\":510,\"timestamp_end\":540},\"tips\":[{\"text\":\"Your fist should align with your shoulder line and your elbow should be naturally straight.\",\"timestamp\":511.2,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"Pyojokchagi is a technique used to create a target with the palm of your hand.\",\"timestamp\":522.3,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"Kick outside in using the foot blade.\",\"timestamp\":529.8,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"Be careful not to kick with the sole of your foot.\",\"timestamp\":535.8,\"video_id\":\"6FUM1p6qqhQ\"}],\"used_in\":[\"taegeuk-7\"]},\"side-punch\":{\"key\":\"side-punch\",\"name\":{\"en\":\"Side Punch\",\"ko\":\"옆지르기\",\"romanized\":\"Yeopjireugi\"},\"category\":\"strike\",\"source\":{\"form_id\":\"taegeuk-7\",\"form_name\":\"Taegeuk Chil Jang\",\"video_id\":\"6FUM1p6qqhQ\",\"timestamp\":540,\"timestamp_end\":570},\"tips\":[{\"text\":\"Is a technique used to thrust sideways while standing sideways like Jujumsogi.\",\"timestamp\":544.7,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"The flow of force progress transferred from the ground is pushed up to the fist through the elbow.\",\"timestamp\":552.6,\"video_id\":\"6FUM1p6qqhQ\"},{\"text\":\"Bumsogi posture is achieved by shifting your weight on your hind leg\",\"timestamp\":558.6,\"video_id\":\"6FUM1p6qqhQ\"}],\"used_in\":[\"sipjin\",\"taegeuk-7\"]},\"tiger-stance\":{\"key\":\"tiger-stance\",\"name\":{\"en\":\"Tiger Stance\",\"ko\":\"범서기\",\"romanized\":\"Beomseogi\"},\"category\":\"stance\",\"source\":{\"form_id\":\"taegeuk-7\",\"form_name\":\"Taegeuk Chil Jang\",\"video_id\":\
